<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Labeller</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="pane" id="left">
  <h2 class="ph">Folders</h2>
  <div id="folders"></div>
  <div id="filters">
    <button data-f="all" class="on">All<b id="c-all">0</b></button>
    <button data-f="yes">Boxed<b id="c-yes">0</b></button>
    <button data-f="no">Blank<b id="c-no">0</b></button>
    <button data-f="check">Check<b id="c-check">0</b></button>
  </div>
  <h2 class="ph">Frames <span class="n" id="fcount"></span></h2>
  <div id="frames"></div>
</div>

<div id="mid">
  <div id="bar">
    <button class="btn" id="prev">← Prev</button>
    <button class="btn" id="next">Next →</button>
    <span id="pos"></span>
    <button class="btn" id="enh" title="Contrast enhance for viewing (E)">Contrast</button>
    <button class="btn" id="fit" title="Fit to window (F)">Fit</button>
    <span id="title">—</span>
    <span class="sp"></span>
    <button class="btn" id="ai" title="Run the detectors (A)">AI assist</button>
    <button class="btn" id="blank" title="Mark as having no drone (B)">No drone</button>
    <button class="btn pri" id="save" title="Save (S) — also saves automatically on navigate">Save</button>
    <button class="btn danger" id="del" title="Delete this frame entirely">Delete frame</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="loupe"><canvas id="lp" width="210" height="210"></canvas></div>
    <div id="hint">
      <b>click</b> snap · <b>drag</b> draw · <b>click box</b> select, then drag to move or pull a
      handle · <b>wheel</b> zoom · <b>space-drag</b> pan · <b>Del</b> remove · saves on navigate
    </div>
  </div>
</div>

<div class="pane" id="right">
  <h2 class="ph">Boxes <span class="n" id="bcount"></span></h2>
  <div id="boxes"></div>
  <h2 class="ph">Assisted candidates</h2>
  <div id="cands"><div class="empty">Press <b>A</b> to run the detectors.</div></div>
</div>

<div id="toasts"></div>

<div id="veil">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">Title</h3>
    <div class="body" id="mb"></div>
    <div class="acts">
      <button class="btn" id="mcancel">Cancel</button>
      <button class="btn destroy" id="mok">Delete</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
